<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre Trudelle | Junior Game Developer</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f4f4; color: #333; }
        header { border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
        .project-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tag { background: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; }
        .links { margin-top: 20px; }
        a { color: #0066cc; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        code { background: #eee; padding: 2px 4px; }
        
        /* Video Container to keep it 16:9 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin: 20px 0;
            border-radius: 4px;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <section>
        <div class="project-card">
            <h3>2D Monster Tamer (Unity/C#)</h3>
            <p><em>A 2D Monster-Taming RPG inspired by classic genre pillars like Pokémon.</em></p>           
            <div class="video-container">
                <iframe src="https://youtu.be/d7jXUdTDaT0" title="Monster Tamer Gameplay" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>     
            <div class="links">
                <a href="https://github.com/TrudelleDev/MonsterTamer">View Source Code on GitHub →</a>
            </div>
        </div>
    </section>
</body>
</html>
