<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexandre Trudelle | Junior Game Developer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 40px 20px; background: #f0f2f5; color: #333; }
        header { border-bottom: 3px solid #333; padding-bottom: 20px; margin-bottom: 40px; }
        h1 { margin: 0; color: #1a1a1a; }
        .subtitle { font-size: 1.2em; color: #666; }
        .project-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tags { margin: 15px 0; }
        .tag { background: #e8efff; color: #0056b3; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; margin-right: 8px; }
        .technical-details { background: #fafafa; padding: 15px; border-left: 4px solid #0066cc; margin: 20px 0; font-size: 0.95em; }
        .links { margin-top: 30px; display: flex; gap: 20px; }
        a { color: #0066cc; text-decoration: none; font-weight: bold; transition: color 0.2s; }
        a:hover { color: #004488; text-decoration: underline; }
        
        /* Video Container to keep it 16:9 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            margin: 25px 0;
            border-radius: 8px;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <section>
        <div class="project-card">
            <h3>Featured Project: Monster Tamer</h3>
            <p><em>An original 2D Monster-Taming RPG built from the ground up in Unity.</em></p>
            
            <div class="tags">
                <span class="tag">Unity 2D</span>
                <span class="tag">C#</span>
                <span class="tag">Architecture</span>
                <span class="tag">Modular Systems</span>
            </div>

            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/d7jXUdTDaT0?mute=1" 
                    title="Monster Tamer Gameplay Showcase" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
            <div class="links">
                <a href="https://github.com/TrudelleDev/MonsterTamer">View GitHub Repository →</a>
                <a href="https://www.linkedin.com/in/alexandre-trudelle/">LinkedIn Profile →</a>
            </div>
        </div>
    </section>
</body>
</html>
